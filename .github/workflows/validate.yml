name: Validate Vision desktop and installer
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -c requirements.lock.txt -e ".[test]"
      - run: python -m pip install "playwright==1.63.0"
      - run: python -m playwright install chromium
      - run: python scripts/dev.py check tests
      - run: python scripts/acceptance_http.py
      - run: python scripts/check_browser.py
      - run: python scripts/check_desktop.py
      - run: python scripts/check_desktop.py --demo
      - run: python scripts/check_desktop_views.py --scale 1
      - run: python scripts/check_desktop_views.py --scale 1.25
      - run: python scripts/check_desktop_views.py --scale 1.5
      - run: python scripts/check_desktop_views.py --scale 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-evidence
          path: |
            .cache/dev-checks/*.log
            .cache/acceptance-http/**/report.json
            .cache/browser-checks/**/report.json
            .cache/browser-checks/**/*.png
            .cache/desktop-checks/**/report.json
            .cache/desktop-checks/**/*.png
            .cache/desktop-checks/**/*.log
            .cache/desktop-view-checks/**/report.json
            .cache/desktop-view-checks/**/*.png
            .cache/desktop-view-checks/**/*.log
          retention-days: 7
  installer:
    needs: source
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -c requirements.lock.txt -e ".[test]"
      - run: python -m pip install "playwright==1.63.0" "pyinstaller==6.22.3"
      - run: python -m playwright install chromium
      - run: powershell -NoProfile -File scripts/install_build_tools.ps1
      - run: python scripts/package_windows.py --check-installer
      - run: python scripts/package_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: vision-windows-installer
          path: |
            dist/Vision.exe
            dist/Vision.exe.sha256
            dist/release-manifest.json
            dist/acceptance-report.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-evidence
          path: |
            .cache/windows-build/**/build.log
            .cache/windows-build/**/installer.log
            .cache/installer-checks/**/*.log
            .cache/installer-checks/**/report.json
            .cache/desktop-checks/**/*.png
            .cache/desktop-checks/**/*.log
            .cache/desktop-checks/**/report.json
            .cache/browser-checks/**/report.json
            .cache/acceptance-http/**/report.json
          retention-days: 7
