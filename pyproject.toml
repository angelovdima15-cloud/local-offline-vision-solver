[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-offline-vision-solver"
version = "0.4.0"
description = "Local offline academic vision solver with a mobile LAN website"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.10,<3",
  "Pillow>=11,<13",
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.11,<5",
  "matplotlib>=3.10,<4",
  "sympy>=1.13,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "zeroconf>=0.145,<1",
  "ifaddr>=0.2,<1",
  "pillow-heif>=1.7,<2",
  "qrcode>=8.2,<9",
  "PySide6==6.11.2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
vision-solver = "local_vision_solver.cli:main"
vision-desktop = "local_vision_solver.desktop.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_vision_solver = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "assets.lock.json", "desktop/qml/*.qml", "desktop/qml/components/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
